name: bench

on:
  push:
    branches: [main]
  # Every pull request reports a bench check, so main can require it. The suite takes up to half an
  # hour, so the scope step skips it unless the pull request changes what the bench module builds.
  pull_request:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

concurrency:
  group: bench-${{ github.event.pull_request.number || github.run_id }} # one group per pull request
  cancel-in-progress: true

jobs:
  bench:
    name: bench
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GOWORK: 'off'
    defaults:
      run:
        shell: bash # -eo pipefail, so a failure before | tee fails the step
        working-directory: bench
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # What the bench module builds: the packages it imports, the module itself, and the root go.mod,
      # whose requirements enter the module graph. The replaced root's go.sum is never read. A
      # failure here fails the check rather than skipping the suite.
      - name: scope
        id: scope
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "${{ github.event.pull_request.base.sha }}"...HEAD)
          run=false
          for f in $files; do
            case "$f" in
              bench/*|go.mod|.github/workflows/bench.yml) run=true ;;
              *_test.go|testdata/*|*/testdata/*) ;;
              internal/*|persist/*|sim/*) run=true ;;
              */*) ;;
              *.go) run=true ;;
            esac
          done
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        if: steps.scope.outputs.run == 'true'
        with:
          go-version: '1.26.x'
      - name: budget-update trailers
        if: github.event_name == 'pull_request'
        run: |
          set -e
          for p in bench/results/baseline.txt bench/budgets.txt bench/go.mod; do
            msgs=$(git log --format=%B "origin/${{ github.base_ref }}..HEAD" -- "../$p")
            if [ -n "$msgs" ] && ! grep -q '^Budget-Update: ' <<<"$msgs"; then
              echo "bench: $p changed without a Budget-Update trailer"
              exit 1
            fi
          done
      - name: simulation seeds per second
        if: steps.scope.outputs.run == 'true'
        run: LOCKSTEP_BENCH_OUT=$PWD/sim.txt go test -run '^TestSimSeeds$' -count 10 .
      - name: benchmarks without GoAkt
        if: steps.scope.outputs.run == 'true'
        run: go test -run '^$' -bench . -skip '/lib=goakt' -benchmem -count 10 -timeout 80m ./... | tee results.txt
      - name: GoAkt benchmarks, in a process of their own
        if: steps.scope.outputs.run == 'true'
        run: go test -run '^$' -bench '/lib=goakt' -benchmem -count 10 -timeout 80m . | tee -a results.txt
      - name: budgets
        if: steps.scope.outputs.run == 'true'
        run: go run ./cmd/budget check -budgets budgets.txt results.txt sim.txt | tee budget.txt
      - uses: actions/upload-artifact@v7
        if: always() && steps.scope.outputs.run == 'true'
        with:
          name: bench-results
          path: |
            bench/results.txt
            bench/sim.txt
            bench/budget.txt
